<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar conta | GIECI</title>

  <link rel="stylesheet" href="/assets/Style/Signup.css" />
</head>

<body>
  <main class="signup-container">
    <section class="signup-card">
      <div class="signup-header">
        <h1>GIECI</h1>
        <p>Gestão Inteligente de Estoque para Cozinhas Industriais</p>
      </div>

      <h2>Criar conta</h2>

      <form id="signup-form">
        <div class="campo">
          <label for="email">E-mail</label>

          <input
            type="email"
            id="email"
            placeholder="seuemail@gmail.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="campo">
          <label for="password">Senha</label>

          <input
            type="password"
            id="password"
            placeholder="Digite sua senha"
            autocomplete="new-password"
            minlength="8"
            required
          />
        </div>

        <div class="campo">
          <label for="confirm-password">Confirmar senha</label>

          <input
            type="password"
            id="confirm-password"
            placeholder="Confirme sua senha"
            autocomplete="new-password"
            minlength="8"
            required
          />
        </div>

        <p id="signup-message"></p>

        <button type="submit" id="signup-button">
          Cadastrar
        </button>
      </form>

      <div class="login-link">
        <span>Já possui uma conta?</span>
        <a href="/">Fazer login</a>
      </div>
    </section>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      console.log("Página de cadastro carregada.");

      const form = document.getElementById("signup-form");

      const emailInput = document.getElementById("email");

      const passwordInput = document.getElementById("password");

      const confirmPasswordInput =
        document.getElementById("confirm-password");

      const message =
        document.getElementById("signup-message");

      const button =
        document.getElementById("signup-button");


      function mostrarMensagem(texto, tipo = "erro") {
        message.textContent = texto;

        if (tipo === "sucesso") {
          message.style.color = "#2e7d32";
        } else {
          message.style.color = "#d32f2f";
        }
      }


      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        mostrarMensagem("");

        const email =
          emailInput.value.trim().toLowerCase();

        const password =
          passwordInput.value;

        const confirmPassword =
          confirmPasswordInput.value;


        if (!email) {
          mostrarMensagem("Informe seu e-mail.");
          return;
        }


        if (!password) {
          mostrarMensagem("Informe sua senha.");
          return;
        }


        if (password.length < 8) {
          mostrarMensagem(
            "A senha deve possuir pelo menos 8 caracteres."
          );

          return;
        }


        if (password !== confirmPassword) {
          mostrarMensagem(
            "As senhas não coincidem."
          );

          return;
        }


        try {
          button.disabled = true;

          button.textContent =
            "Cadastrando...";


          console.log(
            "Enviando cadastro para /api/auth/register"
          );


          const response = await fetch(
            "/api/auth/register",
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              credentials: "include",

              body: JSON.stringify({
                email,
                password
              })
            }
          );


          const texto =
            await response.text();


          let data = {};


          if (texto) {
            try {
              data = JSON.parse(texto);
            } catch {
              console.error(
                "Resposta recebida:",
                texto
              );

              throw new Error(
                "O servidor retornou uma resposta inválida."
              );
            }
          }


          console.log(
            "Status:",
            response.status
          );


          console.log(
            "Resposta:",
            data
          );


          if (!response.ok) {
            throw new Error(
              data.error ||
              data.message ||
              "Não foi possível realizar o cadastro."
            );
          }


          mostrarMensagem(
            "Cadastro realizado com sucesso!",
            "sucesso"
          );


          form.reset();


          setTimeout(() => {
            window.location.href = "/";
          }, 1500);


        } catch (error) {

          console.error(
            "Erro no cadastro:",
            error
          );


          mostrarMensagem(
            error.message ||
            "Erro ao conectar com o servidor."
          );


        } finally {

          button.disabled = false;

          button.textContent =
            "Cadastrar";
        }
      });
    });
  </script>
</body>
</html>
