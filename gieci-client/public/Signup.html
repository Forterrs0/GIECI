<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro — GIECI</title>

    <link
        rel="stylesheet"
        href="/assets/Style/Signup.css"
    >
</head>

<body>

    <main class="gieci-app g-login-screen">

        <section class="g-form g-login-card">

            <div class="g-brand">

                <div class="g-brand-text">

                    <h1 class="g-brand-title">
                        GIECI
                    </h1>

                    <p>
                        Gestão Inteligente de Estoque para Cozinhas Industriais
                    </p>

                </div>

            </div>


            <form id="signup-form">

                <h2 class="g-cadastrar-title">
                    Criar conta
                </h2>


                <div class="g-field">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        class="g-input"
                        id="email"
                        type="email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="g-field">

                    <label for="password">
                        Senha
                    </label>

                    <input
                        class="g-input"
                        id="password"
                        type="password"
                        autocomplete="new-password"
                        minlength="8"
                        maxlength="72"
                        required
                    >

                </div>


                <div class="g-field">

                    <label for="confirm-password">
                        Confirmar senha
                    </label>

                    <input
                        class="g-input"
                        id="confirm-password"
                        type="password"
                        autocomplete="new-password"
                        minlength="8"
                        maxlength="72"
                        required
                    >

                </div>


                <p
                    id="signup-message"
                    role="status"
                ></p>


                <button
                    id="signup-button"
                    class="g-btn g-btn-primary"
                    type="submit"
                >
                    Cadastrar
                </button>


                <div class="g-login-link">

                    <span>
                        Já possui uma conta?
                    </span>

                    <a href="/">
                        Fazer login
                    </a>

                </div>

            </form>

        </section>

    </main>


    <script src="/JS/assets/js/Signup.js" defer></script>

</body>

</html>
